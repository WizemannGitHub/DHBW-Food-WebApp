server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Alle Pfade auf index.html routen (Single Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck-Endpunkt für Docker
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Kein Caching für JS/CSS damit nach einem Rebuild immer die neuen Dateien geladen werden
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Caching für Bilder und Fonts (ändern sich selten)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Sicherheits-Header
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy       "strict-origin-when-cross-origin";
}
